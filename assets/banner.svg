<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Shelf Gradient -->
    <linearGradient id="shelfGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#0891b2" />
    </linearGradient>
    <linearGradient id="accentPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#7e22ce" />
    </linearGradient>
    <linearGradient id="accentOrange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#c2410c" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="1" opacity="0.3" />
    </pattern>

    <!-- Styles for Animations -->
    <style>
      @keyframes pulse {
        0%, 100% { transform: scale(1); opacity: 0.9; }
        50% { transform: scale(1.03); opacity: 1; }
      }
      @keyframes slideIn {
        from { transform: translateX(-50px); opacity: 0; }
        to { transform: translateX(0); opacity: 1; }
      }
      @keyframes float {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-10px); }
      }
      @keyframes dash {
        to {
          stroke-dashoffset: -40;
        }
      }
      .title-text {
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
        font-weight: 800;
        fill: #ffffff;
        animation: slideIn 1.2s ease-out forwards;
      }
      .subtitle-text {
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
        font-weight: 400;
        fill: #94a3b8;
        animation: slideIn 1.5s ease-out forwards;
      }
      .interactive-box {
        animation: float 4s ease-in-out infinite;
      }
      .interactive-box-delay {
        animation: float 4.5s ease-in-out infinite;
        animation-delay: 1s;
      }
      .glowing-path {
        stroke-dasharray: 10, 30;
        animation: dash 2s linear infinite;
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bgGrad)" />
  <rect width="1200" height="400" fill="url(#grid)" />

  <!-- Abstract Shelf & Merchandising Graphic (Dynamic Aspect) -->
  <g transform="translate(750, 60)">
    <!-- Main Shelf Structure -->
    <rect x="0" y="240" width="380" height="15" rx="5" fill="url(#shelfGrad)" stroke="#475569" stroke-width="1" />
    <rect x="30" y="140" width="320" height="12" rx="4" fill="url(#shelfGrad)" stroke="#475569" stroke-width="1" opacity="0.8" />
    
    <!-- Products on Shelves (Animated) -->
    <!-- Bottom Shelf Products -->
    <rect class="interactive-box" x="20" y="150" width="60" height="90" rx="6" fill="url(#accentCyan)" stroke="#22d3ee" stroke-width="1.5" />
    <rect class="interactive-box" x="28" y="165" width="44" height="25" rx="3" fill="#ffffff" opacity="0.2" />
    
    <rect class="interactive-box-delay" x="90" y="130" width="50" height="110" rx="6" fill="url(#accentPurple)" stroke="#c084fc" stroke-width="1.5" />
    <circle class="interactive-box-delay" cx="115" cy="165" r="12" fill="#ffffff" opacity="0.2" />

    <rect class="interactive-box" x="150" y="170" width="80" height="70" rx="6" fill="url(#accentOrange)" stroke="#ffedd5" stroke-width="1" />
    
    <rect class="interactive-box-delay" x="240" y="110" width="55" height="130" rx="6" fill="url(#accentCyan)" stroke="#22d3ee" stroke-width="1.5" />
    
    <rect class="interactive-box" x="305" y="180" width="45" height="60" rx="6" fill="url(#accentPurple)" stroke="#c084fc" stroke-width="1.5" />

    <!-- Top Shelf Products -->
    <rect class="interactive-box-delay" x="50" y="60" width="45" height="80" rx="4" fill="url(#accentOrange)" stroke="#fdba74" stroke-width="1" opacity="0.9" />
    <rect class="interactive-box" x="110" y="80" width="55" height="60" rx="4" fill="url(#accentCyan)" stroke="#67e8f9" stroke-width="1" opacity="0.9" />
    <rect class="interactive-box-delay" x="180" y="50" width="40" height="90" rx="4" fill="url(#accentPurple)" stroke="#d8b4fe" stroke-width="1" opacity="0.9" />
    <rect class="interactive-box" x="230" y="70" width="70" height="70" rx="4" fill="url(#accentCyan)" stroke="#67e8f9" stroke-width="1" opacity="0.9" />

    <!-- Planogram Grid / Alignment lines (Dynamic Dash) -->
    <line x1="0" y1="240" x2="380" y2="240" stroke="#22d3ee" stroke-width="2" stroke-linecap="round" class="glowing-path" />
    <line x1="30" y1="140" x2="350" y2="140" stroke="#c084fc" stroke-width="2" stroke-linecap="round" class="glowing-path" />

    <!-- Scanner Laser effect -->
    <line x1="220" y1="20" x2="220" y2="260" stroke="#f43f5e" stroke-width="2.5" opacity="0.8">
      <animate attributeName="x1" values="20;360;20" dur="8s" repeatCount="indefinite" />
      <animate attributeName="x2" values="20;360;20" dur="8s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.4;0.9;0.4" dur="2s" repeatCount="indefinite" />
    </line>
  </g>

  <!-- Text Section -->
  <g transform="translate(80, 0)">
    <!-- Decorative Icon / Logo -->
    <g transform="translate(0, 100)" class="interactive-box">
      <rect x="0" y="0" width="60" height="60" rx="12" fill="url(#accentCyan)" />
      <path d="M 15 45 L 15 15 L 45 15" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M 25 35 L 35 35 L 35 25" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    </g>

    <!-- Title and Subtitle -->
    <text x="80" y="145" class="title-text" font-size="46" letter-spacing="-0.5">Awesome Planogram Management</text>
    <text x="80" y="185" class="subtitle-text" font-size="18">A curated list of space planning, shelf optimization, and category management tools</text>
    
    <!-- Badges / Tags in Banner -->
    <g transform="translate(80, 220)">
      <rect x="0" y="0" width="130" height="30" rx="15" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="65" y="20" fill="#38bdf8" font-family="'Inter', sans-serif" font-size="12" font-weight="600" text-anchor="middle">⚡ Space Planning</text>
      
      <rect x="145" y="0" width="145" height="30" rx="15" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="217" y="20" fill="#a855f7" font-family="'Inter', sans-serif" font-size="12" font-weight="600" text-anchor="middle">📦 Shelf Optimization</text>

      <rect x="300" y="0" width="140" height="30" rx="15" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="370" y="20" fill="#f97316" font-family="'Inter', sans-serif" font-size="12" font-weight="600" text-anchor="middle">🛒 Retail Category</text>
    </g>
  </g>
</svg>
